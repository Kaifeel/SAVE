spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:h2:mem:save;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

features:
  direct-payment-transition: true

storage:
  local-root: ${UPLOAD_DIR:uploads}
  public-base-url: ${UPLOAD_PUBLIC_BASE_URL:/uploads}
