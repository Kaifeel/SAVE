spring:
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10485760}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:57671680}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false

server:
  error:
    include-message: never

expo:
  push:
    enabled: ${EXPO_PUSH_ENABLED:false}
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host}
    connect-timeout: ${EXPO_PUSH_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXPO_PUSH_READ_TIMEOUT:5s}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8081,http://127.0.0.1:8081}
  jwt:
    # Local development default only. Set JWT_SECRET to a long random value in production.
    secret: ${JWT_SECRET:save-local-development-jwt-secret-change-me-2026}
    issuer: ${JWT_ISSUER:save-api}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
    cookie-name: save_refresh
    cookie-path: /api/v1/auth
    cookie-secure: false

storage:
  max-file-size: ${UPLOAD_MAX_FILE_SIZE:10485760}
  max-files: ${UPLOAD_MAX_FILES:5}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:69359391525-029eu2u4u5g6r8lqhbi07i5laeh4f10c.apps.googleusercontent.com}
    client-ids: ${GOOGLE_CLIENT_IDS:${google.oauth.client-id}}
    redirect-success-uri: ${GOOGLE_REDIRECT_SUCCESS_URI:http://localhost:5173}
    redirect-ticket-ttl-seconds: ${GOOGLE_REDIRECT_TICKET_TTL_SECONDS:60}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
